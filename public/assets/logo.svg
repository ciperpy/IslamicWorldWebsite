<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer Gold 8-Pointed Star (Rub el Hizb) -->
  <rect x="10" y="10" width="28" height="28" rx="2" fill="#D4AF37" stroke="#F5D061" stroke-width="0.5"/>
  <rect x="10" y="10" width="28" height="28" rx="2" transform="rotate(45 24 24)" fill="#D4AF37" stroke="#F5D061" stroke-width="0.5"/>
  
  <!-- Inner Emerald Core -->
  <circle cx="24" cy="24" r="12" fill="#042F2C" stroke="#D4AF37" stroke-width="1"/>
  
  <!-- Inner Islamic Geometric Star Accents -->
  <circle cx="24" cy="24" r="8" fill="#064E3B"/>
  
  <!-- Central Gold Jewel -->
  <circle cx="24" cy="24" r="4.5" fill="#D4AF37" stroke="#FFF" stroke-width="0.5"/>
  <circle cx="24" cy="24" r="2" fill="#FDF6B2"/>
</svg>
